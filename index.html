    --bg:#faf7f2; --card:#ffffff; --ink:#241f19; --ink-dim:#6b6358;
    --line:#e8e1d6; --accent:#c1673b; --accent-ink:#ffffff;
    --green:#436b4d; --amber:#a9761f; --red:#a13f3f;
    --chip:#f1ece2; --shadow:0 1px 3px rgba(40,30,10,0.08), 0 1px 2px rgba(40,30,10,0.06);
    --heat0:#ece6da; --heat1:#c9d9b3; --heat2:#8fbf7a; --heat3:#4f9a52; --heat4:#2e6f38;
    --fs:19px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#181512; --card:#221e18; --ink:#f2ece0; --ink-dim:#a89e8e;
      --line:#3a352c; --accent:#e08a5b; --accent-ink:#1c1108;
      --green:#7fb389; --amber:#d9a75c; --red:#e17f7f; --chip:#2c281f;
      --heat0:#2c281f; --heat1:#3f5a3a; --heat2:#4f7d4a; --heat3:#6ea564; --heat4:#9bd48f;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--ink);}
  body{font-family:"Tahoma","Segoe UI",-apple-system,sans-serif; font-size:var(--fs); line-height:1.6; padding-bottom:96px;}
  .wrap{max-width:560px; margin:0 auto; padding:16px;}
  h1{font-size:1.5rem; margin:6px 0 4px;}
  h2{font-size:1.2rem; margin:10px 0 6px;}
  .sub{color:var(--ink-dim); font-size:1rem; margin:0 0 14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
  .btn{background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px; padding:16px 18px; font-size:1.08rem; font-weight:700; cursor:pointer; width:100%; min-height:54px; font-family:inherit;}
  .btn.secondary{background:var(--chip); color:var(--ink);}
  .btn.small{padding:10px 14px; font-size:0.95rem; min-height:44px; width:auto;}
  .btn:disabled{opacity:0.5;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  input[type=text],input[type=password],input[type=number],input[type=date],textarea,select{
    width:100%; background:var(--bg); color:var(--ink); border:2px solid var(--line);
    border-radius:12px; padding:13px 14px; font-size:1.05rem; font-family:inherit;
  }
  textarea{resize:vertical; min-height:90px;}
  label.f{display:block; font-size:1rem; color:var(--ink-dim); margin:10px 0 5px; font-weight:600;}
  .chip{background:var(--chip); border-radius:999px; padding:5px 14px; font-size:0.9rem; display:inline-block;}
  .tabbar{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 4px calc(8px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto;}
  .tab{flex:1; text-align:center; background:none; border:none; color:var(--ink-dim); font-size:0.8rem; padding:6px 0; cursor:pointer; font-weight:600; font-family:inherit;}
  .tab .ic{font-size:1.6rem; display:block;}
  .tab.active{color:var(--accent);}
  .memberpick{display:flex; gap:10px; flex-wrap:wrap;}
  .memberpick button{flex:1; min-width:100px; background:var(--chip); border:3px solid transparent; border-radius:16px; padding:22px 10px; text-align:center; cursor:pointer; color:var(--ink); font-size:1.15rem; font-weight:700; font-family:inherit;}
  .item{border-top:1px solid var(--line); padding:14px 0;}
  .item:first-child{border-top:none; padding-top:0;}
  .title-line{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .title-line strong{font-size:1.08rem;}
  .meta{color:var(--ink-dim); font-size:0.92rem; margin-top:3px;}
  .done-badge{background:var(--green); color:#fff; padding:5px 12px; border-radius:999px; font-size:0.9rem;}
  .iconbtn{background:none; border:none; font-size:1.4rem; cursor:pointer; color:var(--ink-dim); padding:4px;}
  #toast{position:fixed; top:14px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 20px; border-radius:14px; font-size:1rem; z-index:999; display:none; max-width:92%; text-align:center;}
  .card.primary{border-color:var(--accent); border-width:2px;}
  .card.quiet strong{color:var(--ink-dim);}
  #toast.hasAction{display:none; align-items:center; gap:14px; text-align:right; padding:10px 12px 10px 20px;}
  #toast.hasAction.show{display:flex;}
  #toast button{background:var(--bg); color:var(--ink); border:none; border-radius:10px; padding:9px 16px; min-height:44px; font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer; flex-shrink:0;}
  .chatbox{max-height:320px; overflow-y:auto; margin-bottom:12px;}
  .bubble{padding:12px 16px; border-radius:14px; margin-bottom:10px; font-size:1.02rem; line-height:1.55; white-space:pre-wrap;}
  .bubble.ai{background:var(--chip);}
  .bubble.me{background:var(--accent); color:var(--accent-ink); margin-right:14%;}
  .bubble.err{background:var(--red); color:#fff;}
  .footer-note{color:var(--ink-dim); font-size:0.9rem; text-align:center; margin-top:18px; line-height:1.6;}
  .bigicon{font-size:2.6rem; text-align:center; margin-bottom:6px;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; display:flex; align-items:flex-end; justify-content:center;}
  .modal{max-width:520px; width:100%; margin:0; border-radius:20px 20px 0 0; max-height:88vh; overflow-y:auto;}
  .stagepill{display:inline-block; background:var(--chip); padding:4px 12px; border-radius:999px; font-size:0.85rem; margin-bottom:8px;}
  .bigcheck{display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line); cursor:pointer;}
  .bigcheck:first-child{border-top:none;}
  .bigcheck .box{width:34px; height:34px; border-radius:10px; border:3px solid var(--line); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem;}
  .bigcheck.done .box{background:var(--green); border-color:var(--green); color:#fff;}
  .bigcheck.done .t{text-decoration:line-through; color:var(--ink-dim);}
  .bigcheck .t{font-size:1.1rem; font-weight:600;}
  .statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;}
  .statgrid .n{font-size:1.35rem; font-weight:700; color:var(--ink-dim);}
  .statgrid .l{font-size:0.8rem; color:var(--ink-dim);}
  .menu-item{display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-top:1px solid var(--line); cursor:pointer; font-size:1.08rem; font-weight:600;}
  .menu-item:first-child{border-top:none;}
  .menu-item .arrow{color:var(--ink-dim);}
  .daybtn{flex:1; min-width:40px; padding:10px 4px; border-radius:10px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; font-family:inherit; font-size:0.95rem;}
  .daybtn.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal .hd{text-align:center; font-size:0.75rem; color:var(--ink-dim); padding:4px 0;}
  .cal .d{aspect-ratio:1; border-radius:10px; background:var(--chip); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:0.9rem; cursor:pointer; position:relative; border:2px solid transparent;}
  .cal .d.today{border-color:var(--accent);}
  .cal .d.sel{background:var(--accent); color:var(--accent-ink);}
  .cal .d.other{opacity:0.35;}
  .cal .dots{display:flex; gap:2px; margin-top:2px; height:6px;}
  .cal .dots i{width:6px; height:6px; border-radius:50%; display:block;}
  .back{background:none; border:none; color:var(--accent); font-size:1rem; font-weight:700; cursor:pointer; padding:0; margin-bottom:8px; font-family:inherit;}
  .streakbig{font-size:2.4rem; font-weight:800; text-align:center;}
  .lb{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .lb .bar{flex:1; height:14px; background:var(--chip); border-radius:999px; overflow:hidden;}
  .lb .bar i{display:block; height:100%; border-radius:999px;}
  .badge-ok{color:var(--green); font-weight:700;}
  .badge-err{color:var(--red); font-weight:700;}
</style>

function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ================= TOAST =================
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.className=""; t.textContent=msg; t.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.display="none";}, 3200); }
function hideToast(){ const t=document.getElementById("toast"); t.className=""; t.style.display="none"; clearTimeout(toastTimer); }
// A toast that carries one action button, shown longer because it needs a decision.
function toastAction(msg, label, onAction, ms){
  const t=document.getElementById("toast");
  t.className="hasAction show"; t.style.display=""; t.innerHTML="";
  const span=document.createElement("span"); span.textContent=msg;
  const btn=document.createElement("button"); btn.textContent=label;
  btn.onclick=()=>{ hideToast(); onAction(); };
  t.appendChild(span); t.appendChild(btn);
  clearTimeout(toastTimer); toastTimer=setTimeout(hideToast, ms||7000);
}
// Deletes are applied straight away, locally and in the cloud, and the toast
// offers to put it back. A confirm() dialog doesn't actually protect anyone —
// people learn to dismiss them reflexively — and doing the delete for real
// (rather than deferring it) means closing the app mid-undo can't resurrect it.
function deleteWithUndo(msg, restore){
  toastAction(msg, "↩️ تراجع", ()=>{ restore(); toast("رجّعناه 👍"); });
}
function ar(n){ return String(n==null?"":n).replace(/[0-9]/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function touch(o){ o.updatedAt=Date.now(); return o; }
function mergeArrayById(local, incoming){
  const map={}; local.forEach(it=>map[it.id]=it);
  incoming.forEach(it=>{ const cur=map[it.id]; if(!cur || (it.updatedAt||0)>=(cur.updatedAt||0)) map[it.id]=it; });
  return Object.values(map);
}

// ================= AI =================
// Key priority: 1) Netlify function proxy (key never on phones)  2) key shared via cloud  3) key on this phone
let proxyAvailable = null; // null = unknown
async function detectProxy(){
  if(proxyAvailable!==null) return proxyAvailable;
  if(!/^https?:/.test(location.protocol)) { proxyAvailable=false; return false; }
  try{ const r=await fetch("/.netlify/functions/ai", {method:"GET"}); proxyAvailable = r.status===200; }
  catch(e){ proxyAvailable=false; }
  return proxyAvailable;
}
function getKey(){ return (state.settings.aiKey||"").trim() || lsGet(LS_KEY).trim(); }
function aiSource(){ if(proxyAvailable) return "proxy"; if((state.settings.aiKey||"").trim()) return "cloud"; if(lsGet(LS_KEY).trim()) return "local"; return "none"; }
async function callAI(systemPrompt, turns){
  await detectProxy();
  const body = { model:"claude-haiku-4-5-20251001", max_tokens:600, system:systemPrompt, messages:turns };
  try{
    let res;
    if(proxyAvailable){
      res = await fetch("/.netlify/functions/ai", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    } else {
      const key=getKey();
      if(!key) return {ok:false, reason:"لا يوجد مفتاح للمساعد. أضفه من: المزيد ← المساعد الذكي."};
      res = await fetch("https://api.anthropic.com/v1/messages", {method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify(body)});
    }
    if(!res.ok){
      let detail=""; try{ const j=await res.json(); detail=(j.error&&j.error.message)||JSON.stringify(j); }catch(e){ detail=await res.text().catch(()=> ""); }
      const hint = res.status===401 ? "المفتاح غير صحيح." : res.status===400 && /credit|balance/i.test(detail) ? "الحساب ما فيه رصيد — لازم تشحن رصيد في console.anthropic.com ← Billing." : res.status===429 ? "تجاوزنا الحد المسموح مؤقتاً، جرّب بعد دقيقة." : "";
      return {ok:false, reason:`${hint} (${res.status}) ${detail}`.trim()};
    }
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    return {ok:true, text};
  }catch(e){ return {ok:false, reason:"ما قدرنا نوصل للمساعد — تأكد من الإنترنت. "+(e&&e.message?e.message:"")}; }
}

function stripTashkeel(s){ return (s||"").replace(/[\u064B-\u0652\u0670\u0640\u06D6-\u06ED]/g,"").replace(/\s+/g," ").trim(); }
function flagUnverifiedCitations(text){
  if(!text) return text;
  const at=QURAN_FRAMEWORK_ITEMS.map(i=>stripTashkeel(i.text)), ar=QURAN_FRAMEWORK_ITEMS.map(i=>stripTashkeel(i.ref));
  let bad=false;
  (text.match(/﴿[^﴾]+﴾/g)||[]).forEach(q=>{ const c=stripTashkeel(q.replace(/[﴿﴾]/g,"")).slice(0,20); if(c.length>5&&!at.some(a=>a.includes(c))) bad=true; });
  (text.match(/«[^»]+»/g)||[]).forEach(q=>{ const c=stripTashkeel(q.replace(/[«»]/g,"")).slice(0,20); if(c.length>5&&!at.some(a=>a.includes(c))) bad=true; });
  (text.match(/سورة\s+\S+\s*[\d٠-٩]+\s*[:：]\s*[\d٠-٩\-–]+/g)||[]).forEach(r=>{ const rr=stripTashkeel(r); if(!ar.some(a=>a.includes(rr)||rr.includes(a))) bad=true; });
  return bad ? text+"\n\n⚠️ تنبيه من البرنامج: هذا الرد يحتوي على استشهاد غير موجود في القائمة المعتمدة. لا تعتمد عليه قبل التحقق." : text;
}
function buildJudgmentContext(){
  let ctx=CORE_GUARDRAILS;
  if(getUseQuranFW()) ctx+=`\n\n${quranFrameworkInstruction()}`;
  if(getPersona().trim()) ctx+=`\n\nشخصية المساعد ومبادئه كما حددتها العائلة:\n${getPersona().trim()}`;
  if(getBookRules().trim()) ctx+=`\n\nقواعد من مرجع اعتمدته العائلة:\n${getBookRules().trim()}`;
  const profs=allProfilesText();
  if(profs) ctx+=`\n\nبطاقات أفراد العائلة (كل شخص كتبها عن نفسه — لا تستنتج صفة لم يكتبها):\n${profs}\n\nخاطب كل شخص بالطريقة التي طلبها، واقترح ما يهدّئه إذا احتدم النقاش. ممنوع استخدام خانة "ما يُثيرني" للضغط على أحد.`;
  if(state.agreedRules.length) ctx+=`\n\nقواعد سبق أن اتفقت عليها العائلة (يراها الجميع، اعتبرها معياراً قائماً):\n${state.agreedRules.map(r=>`- ${r.text}`).join("\n")}`;
  const s30=computeStats(30);
  ctx+=`\n\nوقائع مسجلة (آخر ٣٠ يوم): `+state.settings.members.map(m=>`${m.name}: ${s30[m.id].done} مهمة منجزة، ${s30[m.id].complaints} شكوى`).join("؛ ");
  return ctx+"\n\n---\n\n";
}
function activeFrameworkSummary(){ return (getUseQuranFW()||getPersona().trim()||getBookRules().trim()) ? "🧭 المساعد يعتمد على مبادئ حددتها العائلة (تشوفها في المزيد)." : ""; }
async function extractRulesFromText(rawText, onProgress){
  const chunks=[]; for(let i=0;i<rawText.length;i+=6000) chunks.push(rawText.slice(i,i+6000));
  const use=chunks.slice(0,20); const partials=[];
  for(let i=0;i<use.length;i++){ if(onProgress) onProgress(i+1,use.length);
    const r=await callAI("استخرج من النص التالي أهم القواعد والمبادئ العملية لتقييم خلافات عائلية بإنصاف. نقاط قصيرة بالعربي فقط، بدون مقدمة.", [{role:"user",content:use[i]}]);
    if(r.ok) partials.push(r.text); else return r; }
  if(!partials.length) return {ok:false, reason:"لم يُستخرج شيء"};
  if(partials.length===1) return {ok:true,text:partials[0]};
  const c=await callAI("ادمج القوائم التالية بإزالة التكرار واختر أفضل ١٥-٢٥ قاعدة عملية كنقاط قصيرة بالعربي.", [{role:"user",content:partials.join("\n\n---\n\n")}]);
  return c.ok?{ok:true,text:c.text}:{ok:true,text:partials.join("\n")};
}

let cloud=null, cloudStatus="off", cloudStatusMsg="";
async function initCloud(){
  const fam=getFamilyCode();
  if(!cloudConfigured()||!fam){ cloudStatus="off"; return; }
  cloudStatus="connecting"; render();
  try{
    const base=`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
    const [appM,fsM,authM]=await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-firestore.js"), import(base+"firebase-auth.js")]);
    const app=appM.initializeApp(FIREBASE_CONFIG);
    let db; try{ db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentMultipleTabManager()})}); }catch(e){ db=fsM.getFirestore(app); }
    await authM.signInAnonymously(authM.getAuth(app));
    const root=(col)=>fsM.collection(db,"families",fam,col);
    const settingsRef=fsM.doc(db,"families",fam,"meta","settings");
    cloud={
      push:(col,item)=>fsM.setDoc(fsM.doc(db,"families",fam,col,item.id),item).catch(e=>console.warn("push",e)),
      remove:(col,id)=>fsM.deleteDoc(fsM.doc(db,"families",fam,col,id)).catch(e=>console.warn("del",e)),
      pushSettings:()=>fsM.setDoc(settingsRef,{members:state.settings.members,profiles:state.settings.profiles||{},aiKey:state.settings.aiKey||"",updatedAt:Date.now()}).catch(e=>console.warn("settings",e)),
      pushCase:(c)=>fsM.setDoc(fsM.doc(db,"families",fam,"cases",c.id),{id:c.id,from:c.from,about:c.about,title:c.title,stage:c.stage,neutralSummary:c.neutralSummary||"",suggestions:c.suggestions||[],proposedResolution:c.proposedResolution||"",noteFromSender:c.noteFromSender||"",noteFromResponder:c.noteFromResponder||"",tag:c.tag||"",takeaway:c.takeaway||"",sentAt:c.sentAt||0,openedAt:c.openedAt||0,round:c.round||1,rounds:c.rounds||[],updatedAt:Date.now()}).catch(e=>console.warn("case",e))
    };
    let seeded=lsGet("hh_cloud_seeded_"+fam)==="1";
    if(!seeded){ for(const col of SYNCED_COLLECTIONS) for(const it of state[col]) await cloud.push(col,it); await cloud.pushSettings(); lsSet("hh_cloud_seeded_"+fam,"1"); }
    fsM.onSnapshot(settingsRef, snap=>{
      if(!snap.exists()){ cloud.pushSettings(); return; }
      const d=snap.data();
      if(d.members) state.settings.members=d.members;
      if(d.profiles) state.settings.profiles=d.profiles;
      if(typeof d.aiKey==="string") state.settings.aiKey=d.aiKey;
      saveState(); render();
    });
    SYNCED_COLLECTIONS.forEach(col=>{
      fsM.onSnapshot(root(col), qs=>{ const remote=[]; qs.forEach(d=>remote.push(d.data())); const ids=new Set(remote.map(r=>r.id));
        state[col]=mergeArrayById(state[col].filter(x=>ids.has(x.id)),remote); saveState(); render(); });
    });
    fsM.onSnapshot(root("cases"), qs=>{
      let changed=false;
      qs.forEach(d=>{ const r=d.data(); let local=findCase(r.id);
        if(r.about===meId && r.stage==="sent" && !local){ cases.push({id:r.id,from:r.from,about:meId,title:r.title,tag:r.tag||"",stage:"received",threadA:[],neutralSummary:r.neutralSummary,suggestions:r.suggestions||[],threadB:[],proposedResolution:"",noteFromSender:r.noteFromSender||"",noteFromResponder:"",takeaway:"",sentAt:r.sentAt||0,openedAt:0,round:r.round||1,rounds:r.rounds||[],createdAt:Date.now()}); changed=true; toast(`📩 وصلتك رسالة من ${memberName(r.from)}`); }
        // sender revised before this phone opened it — refresh the inbox copy in place
        if(r.about===meId && r.stage==="sent" && local && !local.openedAt && (r.round||1)===(local.round||1) && (local.neutralSummary!==r.neutralSummary || (local.noteFromSender||"")!==(r.noteFromSender||""))){
          local.neutralSummary=r.neutralSummary; local.suggestions=r.suggestions||[]; local.noteFromSender=r.noteFromSender||""; local.stage="received"; changed=true; toast(`✏️ عدّل ${memberName(r.from)} رسالته`); }
        // a further round arrived on a case this phone already holds
        if(r.about===meId && r.stage==="sent" && local && (r.round||1)>(local.round||1)){
          local.neutralSummary=r.neutralSummary; local.suggestions=r.suggestions||[]; local.noteFromSender=r.noteFromSender||""; local.proposedResolution=""; local.noteFromResponder=""; local.takeaway=""; local.round=r.round||1; local.rounds=r.rounds||[]; local.sentAt=r.sentAt||0; local.openedAt=0; local.stage="received"; changed=true; toast(`🔁 جولة جديدة من ${memberName(r.from)}`); }
        if(r.from===meId && r.stage==="b_ready" && local && local.stage!=="awaiting_a" && local.stage!=="closed"){ local.proposedResolution=r.proposedResolution; local.noteFromResponder=r.noteFromResponder||""; local.takeaway=r.takeaway||local.takeaway||""; local.stage="awaiting_a"; changed=true; toast(`✅ رد ${memberName(r.about)} جاهز`); }
        // recipient opened it — propagate back so the sender's revise button locks
        if(r.openedAt && local && !local.openedAt){ local.openedAt=r.openedAt; changed=true; }
        if(r.stage==="closed" && local && local.stage!=="closed"){ local.stage="closed"; local.rounds=r.rounds||local.rounds||[]; changed=true; }
      });
      if(changed){ saveCases(); render(); }
    });
    cloudStatus="on"; render();
  }catch(e){ console.error(e); cloudStatus="error"; cloudStatusMsg=(e&&e.code)?String(e.code):(e&&e.message)||"تعذّر الاتصال"; cloud=null; render(); }
}

// ================= PUSH NOTIFICATIONS =================
function urlBase64ToUint8Array(base64String){
  const padding="=".repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,"+").replace(/_/g,"/");
  const raw=atob(base64); const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i);
  return arr;
}
function myPushSub(){ return state.pushSubs.find(s=>s.memberId===meId); }
async function subscribeToPush(){
  try{
    if(!("serviceWorker" in navigator)||!("PushManager" in window)) return {ok:false, reason:"المتصفح ما يدعم التنبيهات."};
    if(!cloud) return {ok:false, reason:"لازم تربط الجوال بالعائلة أول (☁️ الربط بين الجوالات)."};
    const perm=await Notification.requestPermission();
    if(perm!=="granted") return {ok:false, reason:"ما وافقت على إذن التنبيهات."};
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});
    const json=sub.toJSON();
    state.pushSubs=state.pushSubs.filter(s=>!(s.memberId===meId));
    const it=touch({id:uid(), memberId:meId, endpoint:json.endpoint, keys:json.keys, createdAt:Date.now()});
    state.pushSubs.push(it); saveState(); cloud.push("pushSubs",it);
    return {ok:true};
  }catch(e){ return {ok:false, reason:(e&&e.message)||String(e)}; }
}
async function unsubscribeFromPush(){
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  const mine=state.pushSubs.filter(s=>s.memberId===meId);
  state.pushSubs=state.pushSubs.filter(s=>s.memberId!==meId); saveState();
  if(cloud) mine.forEach(s=>cloud.remove("pushSubs",s.id));
  toast("تم إيقاف التنبيهات.");
}

function isDueToday(c, dateStr){
  const d=new Date((dateStr||todayStr())+"T12:00:00").getDay();
  if(c.freq==="daily"||c.freq==="weekly") return true;
  if(c.freq==="days") return (c.days||[]).includes(d);
  if(c.freq==="anytime") return false;
  if(c.freq==="once") return Object.keys(c.log||{}).length===0;
  return true;
}
function isMine(c){ return c.assignee===meId||c.assignee==="anyone"; }
function addChore(title,assignee,freq,days,rotation){ const it=touch({id:uid(),title,assignee,freq,days:days||[],rotation:rotation||[],log:{},createdAt:Date.now()}); state.chores.push(it); saveState(); if(cloud) cloud.push("chores",it); render(); }
// Whose turn it is, DERIVED from the completion log rather than stored as a counter:
// a stored index would fight itself under last-write-wins merge, and deriving also
// self-corrects when somebody covers out of turn (the person they covered for is still next).
function whoseTurn(c){
  const rot=(c.rotation||[]).filter(id=>state.settings.members.some(m=>m.id===id));
  if(rot.length<2) return null;
  const dates=Object.keys(c.log||{}).sort();
  for(let i=dates.length-1;i>=0;i--){ const idx=rot.indexOf((c.log[dates[i]]||{}).by); if(idx>=0) return rot[(idx+1)%rot.length]; }
  return rot[0];
}
// "when did we last do this" matters far more for as-needed jobs than for scheduled ones
function lastDone(c){
  const dates=Object.keys(c.log||{}).sort();
  if(!dates.length) return null;
  const d=dates[dates.length-1];
  return {date:d, by:(c.log[d]||{}).by, days:Math.round((new Date(todayStr()+"T12:00:00")-new Date(d+"T12:00:00"))/86400000)};
}
function agoLabel(n){ return n<=0?"اليوم":n===1?"أمس":n<=10?`قبل ${["","يوم","يومين","٣ أيام","٤ أيام","٥ أيام","٦ أيام","٧ أيام","٨ أيام","٩ أيام","١٠ أيام"][n]}`:`قبل ${ar(n)} يوم`; }

}

// ================= STATS / STREAKS =================
function computeStats(days){
  const cutoff=Date.now()-days*86400000; const s={};
  state.settings.members.forEach(m=>s[m.id]={done:0,complaints:0});
  state.chores.forEach(c=>Object.entries(c.log||{}).forEach(([d,e])=>{ if(new Date(d+"T12:00:00").getTime()>=cutoff && s[e.by]) s[e.by].done++; }));
  state.complaints.forEach(c=>{ if(c.createdAt>=cutoff && s[c.from]) s[c.from].complaints++; });
  return s;
}
// Captured ONCE at boot: the digest must not shift or empty out while you are
// reading it. The stored mark only moves forward when the app is backgrounded,
// so "since you last looked" means since you last had it open.
let seenSince=null;
function initLastSeen(){
  const raw=lsGet(LS_LASTSEEN);
  seenSince=raw?parseInt(raw,10):Date.now();   // first ever run shows nothing, not everything
  if(!raw) lsSet(LS_LASTSEEN,String(Date.now()));
}
function markSeen(){ try{ lsSet(LS_LASTSEEN,String(Date.now())); }catch(e){} }
// Only other people's actions — being told what you yourself just did is noise.
function recentChanges(){
  if(!seenSince) return [];
  const out=[];
  state.chores.forEach(c=>Object.entries(c.log||{}).forEach(([d,e])=>{
    if(e&&e.at>seenSince&&e.by!==meId) out.push({at:e.at,who:e.by,text:`سوّى: ${c.title}`}); }));
  state.restock.forEach(r=>{
    if(r.addedAt>seenSince&&r.addedBy!==meId) out.push({at:r.addedAt,who:r.addedBy,text:`أضاف للقائمة: ${r.name}`});
    if(r.boughtAt&&r.boughtAt>seenSince&&r.boughtBy!==meId) out.push({at:r.boughtAt,who:r.boughtBy,text:`اشترى: ${r.name}`}); });
  state.kudos.forEach(k=>{
    if(k.createdAt>seenSince&&k.memberId!==meId) out.push({at:k.createdAt,who:k.memberId,text:`سجّل: ${k.text}`});
    else if(k.memberId===meId&&(k.updatedAt||0)>seenSince&&Object.keys(k.confirmedBy||{}).length)
      out.push({at:k.updatedAt,who:null,text:`تم تأكيد: ${k.text}`}); });
  state.agreedRules.forEach(r=>{ if(r.createdAt>seenSince) out.push({at:r.createdAt,who:null,text:`قاعدة جديدة: ${r.text}`}); });
  state.complaints.forEach(c=>{ if(c.createdAt>seenSince) out.push({at:c.createdAt,who:null,text:`انحلت: ${c.title}`}); });
  return out.sort((a,b)=>b.at-a.at);
}
function recentKudos(){ const cutoff=Date.now()-14*86400000; return state.kudos.filter(k=>(k.createdAt||0)>=cutoff).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); }
function dayCounts(memberId){ // {dateStr: count}
  const out={}; state.chores.forEach(c=>Object.entries(c.log||{}).forEach(([d,e])=>{ if(!memberId||e.by===memberId) out[d]=(out[d]||0)+1; })); return out;
}
function addDays(ds,n){ const d=new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return localDate(d); }
function streakFor(memberId){
  const dc=dayCounts(memberId); const t=todayStr();
  let cur=0, d = dc[t] ? t : addDays(t,-1);
  while(dc[d]){ cur++; d=addDays(d,-1); }
  const dates=Object.keys(dc).sort(); let longest=0, run=0, prev=null;
  dates.forEach(x=>{ run=(prev && addDays(prev,1)===x)?run+1:1; longest=Math.max(longest,run); prev=x; });
  return {current:cur, longest, total:Object.values(dc).reduce((a,b)=>a+b,0)};
}
function heatmapSVG(memberId, weeks){
  const dc=dayCounts(memberId); const t=todayStr(); const cell=13, gap=3; const cols=weeks;
  // align: last column ends today
  const todayDow=new Date(t+"T12:00:00").getDay();
  let svg=`<svg viewBox="0 0 ${cols*(cell+gap)} ${7*(cell+gap)}" width="100%" style="direction:ltr; max-width:420px; display:block; margin:auto;">`;
  for(let c=0;c<cols;c++){ for(let r=0;r<7;r++){
    const daysBack=(cols-1-c)*7 + (todayDow - r); if(daysBack<0) continue;
    const ds=addDays(t,-daysBack); const n=dc[ds]||0; const lvl=n===0?0:n===1?1:n===2?2:n===3?3:4;
    svg+=`<rect x="${c*(cell+gap)}" y="${r*(cell+gap)}" width="${cell}" height="${cell}" rx="3" fill="var(--heat${lvl})"><title>${ds}: ${n}</title></rect>`;
  } }
  return svg+"</svg>";
}

function qrSVG(text){
  try{
    const qr=qrcode(0,"M"); qr.addData(text); qr.make();
    const n=qr.getModuleCount(), cell=6;
    let svg=`<svg viewBox="0 0 ${n*cell} ${n*cell}" style="width:100%;max-width:260px;display:block;margin:auto;background:#fff;border-radius:12px;">`;
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) svg+=`<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="#000"/>`;
    return svg+"</svg>";
  }catch(e){ return `<p class="sub">ما قدرنا نجهز QR (الرمز طويل جداً؟)</p>`; }
}

function openQrScanModal(onResult){
  const modal=document.createElement("div"); modal.className="modal-bg";
  modal.innerHTML=`<div class="card modal"><h2>📷 وجّه الكاميرا لرمز QR</h2><video id="qrVideo" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;"></video><button class="btn secondary" id="qrCancel" style="margin-top:10px;">إلغاء</button></div>`;
  document.body.appendChild(modal);
  let stream=null, stopped=false;
  const cleanup=()=>{ stopped=true; if(stream) stream.getTracks().forEach(t=>t.stop()); modal.remove(); };
  document.getElementById("qrCancel").onclick=cleanup;
  modal.onclick=(e)=>{ if(e.target===modal) cleanup(); };
  (async()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      const video=document.getElementById("qrVideo"); video.srcObject=stream; await video.play();
      const detector=new BarcodeDetector({formats:["qr_code"]});
      const loop=async()=>{
        if(stopped) return;
        try{ const codes=await detector.detect(video); if(codes.length){ const val=codes[0].rawValue; cleanup(); onResult(val); return; } }catch(e){}
        requestAnimationFrame(loop);
      };
      loop();
    }catch(e){ cleanup(); onResult(null, e); }
  })();
}

function threadHTML(thread){ return thread.map(t=>`<div class="bubble ${t.role==="user"?"me":t.role==="error"?"err":"ai"}">${esc(t.content)}</div>`).join(""); }
function scriptedPrompt(n){ return ["طيب، شنو بالضبط صار آخر مرة؟","كيف خلاك تحس؟","شنو تتمنى يتغير بالضبط؟","في حل تقدر تتنازل فيه شوي؟"][Math.min(n,3)]; }
function openCaseModal(caseId){
  const c=findCase(caseId); if(!c) return;
  const modal=document.createElement("div"); modal.className="modal-bg"; modal.innerHTML=`<div class="card modal" id="caseModalInner"></div>`; document.body.appendChild(modal);
  modal.onclick=(e)=>{ if(e.target===modal) modal.remove(); };
  draw();
  function draw(){
    const inner=document.getElementById("caseModalInner");
    if(c.stage==="draft_a"){
      inner.innerHTML=`${roundsMapHTML(c)}<div class="stagepill">خطوة ١ — تعريف الشكوى${(c.round||1)>1?` — الجولة ${roundNum(c.round)}`:""}</div><label class="f">عن مين؟</label><select id="caseAbout">${state.settings.members.filter(m=>m.id!==meId).map(m=>`<option value="${m.id}" ${c.about===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
        <label class="f">عنوان قصير</label><input type="text" id="caseTitle" value="${esc(c.title||"")}" placeholder="مثلاً: المهام البيتية">
        <label class="f">تصنيف (اختياري)</label><input type="text" id="caseTag" value="${esc(c.tag||"")}" placeholder="مثلاً: المطبخ، الوقت، الفلوس">
        ${activeFrameworkSummary()?`<p class="footer-note" style="text-align:right;background:var(--chip);padding:8px 10px;border-radius:10px;">${activeFrameworkSummary()}</p>`:""}
        <div class="chatbox" id="caseChat">${threadHTML(c.threadA)}</div><textarea id="caseInput" placeholder="اكتب اللي بخاطرك — هذا خاص بك فقط."></textarea>
        <button class="btn small secondary" id="caseSend" style="margin-top:8px;">أرسل</button><button class="btn" id="caseFinish" style="margin-top:12px;">خلصت، جهز الملخص ➜</button>`;
      const chat=document.getElementById("caseChat"); chat.scrollTop=chat.scrollHeight;
      document.getElementById("caseSend").onclick=async()=>{ const v=document.getElementById("caseInput").value.trim(); if(!v) return; document.getElementById("caseInput").value="";
        c.threadA.push({role:"user",content:v}); saveCases(); chat.innerHTML=threadHTML(c.threadA)+`<div class="bubble ai">…</div>`; chat.scrollTop=chat.scrollHeight;
        const res=await callAI(buildJudgmentContext()+`أنت مساعد هادئ ومحايد داخل تطبيق عائلي. الشخص يتكلم معك بخصوصية قبل ما توصل شكواه لأحد. رد على ما قاله بالتحديد، ثم اسأله سؤال واحد قصير لتوضيح: ماذا حدث بالضبط، كيف أثر فيه، أو ماذا يتمنى. أقل من ٧٠ كلمة، بعربية بسيطة ودافئة.`, c.threadA.filter(t=>t.role!=="error"));
        if(res.ok) c.threadA.push({role:"assistant",content:flagUnverifiedCitations(res.text)}); else { c.threadA.push({role:"error",content:"⚠️ المساعد ما رد: "+res.reason}); c.threadA.push({role:"assistant",content:scriptedPrompt(c.threadA.filter(t=>t.role==="user").length-1)}); }
        saveCases(); chat.innerHTML=threadHTML(c.threadA); chat.scrollTop=chat.scrollHeight; };
      document.getElementById("caseFinish").onclick=async()=>{ c.about=document.getElementById("caseAbout").value; c.title=document.getElementById("caseTitle").value.trim()||"بدون عنوان"; c.tag=document.getElementById("caseTag").value.trim();
        const ut=c.threadA.filter(t=>t.role==="user").map(t=>t.content).join("\n"); toast("لحظة، نجهز الملخص…");
        const res=await callAI(buildJudgmentContext()+`لخّص الموقف التالي بجملتين إلى ثلاث بصيغة محايدة تماماً (بدون اتهام). طبّق المبادئ أعلاه، وإذا استشهدت بآية أو حديث اذكر مرجعه بين قوسين داخل النص. ثم اقترح ٢-٣ حلول عملية. ثم اكتب خلاصة قصيرة جداً (٦ كلمات أو أقل) تصف موضوع هذه الجولة. رد بصيغة JSON فقط: {"summary":"...","suggestions":["...","..."],"takeaway":"..."}`, [{role:"user",content:ut||c.title}]);
        if(res.ok){ try{ const j=JSON.parse(res.text.match(/\{[\s\S]*\}/)[0]); c.neutralSummary=flagUnverifiedCitations(j.summary); c.suggestions=(j.suggestions||[]).map(flagUnverifiedCitations); c.takeaway=String(j.takeaway||"").trim().slice(0,60); }catch(e){ c.neutralSummary=res.text.slice(0,400); c.suggestions=[]; c.takeaway=res.text.trim().slice(0,40); } }
        else { toast("⚠️ "+res.reason); c.neutralSummary=ut.slice(0,300)||c.title; c.suggestions=["نجلس الثلاثة ونتكلم بهدوء، دقيقتين لكل شخص بدون مقاطعة."]; c.takeaway=(c.title||ut).slice(0,40); }
        if(!c.takeaway) c.takeaway=(c.title||"بدون خلاصة").slice(0,40);
        c.stage="ready_to_send"; saveCases(); draw(); };
    } else if(c.stage==="ready_to_send"){
      inner.innerHTML=`${roundsMapHTML(c)}<div class="stagepill">خطوة ٢ — راجع قبل الإرسال</div><h2>قال المساعد:</h2><div class="bubble ai">${esc(c.neutralSummary)}</div><label class="f">اقتراحات للحل</label><ul>${c.suggestions.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>
        <p class="sub">كلام المساعد ما يتغيّر — إذا فيه شي ناقص أو غير دقيق، أضفه كملاحظة منك وتوصل الاثنين مع بعض.</p>
        <label class="f">ملاحظة منك (اختياري)</label><textarea id="senderNote" placeholder="مثلاً: توضيح، أو تصحيح لشي">${esc(c.noteFromSender||"")}</textarea>
        <p class="sub">هذا اللي بيوصل لـ <strong>${esc(memberName(c.about))}</strong> فقط — مو الكلام الخاص.</p><button class="btn" id="sendBtn">${cloud?"إرسال ➜":"جهز الرمز ➜"}</button><button class="btn secondary" id="backEdit" style="margin-top:8px;">رجوع للمحادثة</button>`;
      document.getElementById("sendBtn").onclick=()=>{ c.noteFromSender=document.getElementById("senderNote").value.trim(); c.stage="sent"; c.sentAt=Date.now(); saveCases(); if(cloud){ cloud.pushCase(c); modal.remove(); render(); toast(`✅ أُرسلت لـ ${memberName(c.about)}`); } else draw(); };
      document.getElementById("backEdit").onclick=()=>{ c.stage="draft_a"; saveCases(); draw(); };
    } else if(c.stage==="sent"){
      if(cloud){
        inner.innerHTML=`${roundsMapHTML(c)}<h2>✅ أُرسلت لـ ${esc(memberName(c.about))}</h2>
          <p class="sub">${c.openedAt?`فتحها ${esc(memberName(c.about))} — ما عاد تقدر تعدّلها.`:"لسا ما فتحها — تقدر تعدّلها قبل لا يفتحها."}</p>
          ${c.openedAt?"":`<button class="btn secondary" id="reviseBtn">✏️ عدّل قبل ما توصل</button>`}
          ${privateThreadHTML(c.threadA,"اعرض محادثتي الخاصة")}
          <button class="btn secondary" id="cl" style="margin-top:12px;">إغلاق</button>`;
        const rv=document.getElementById("reviseBtn"); if(rv) rv.onclick=()=>{ c.stage="draft_a"; saveCases(); render(); draw(); toast("عدّل اللي تبي، وبعدين أرسلها من جديد."); };
        document.getElementById("cl").onclick=()=>modal.remove();
      } else {
        const pkg=buildPackage(c,"toB");
        inner.innerHTML=`${roundsMapHTML(c)}<h2>أرسل هذا الرمز لـ ${esc(memberName(c.about))}</h2><textarea readonly style="font-family:monospace;font-size:0.85rem;height:90px;">${pkg}</textarea><button class="btn secondary small" id="cp" style="margin-top:8px;">نسخ</button>${privateThreadHTML(c.threadA,"اعرض محادثتي الخاصة")}<button class="btn secondary" id="cl" style="margin-top:14px;">إغلاق</button>`;
        document.getElementById("cp").onclick=()=>navigator.clipboard?.writeText(pkg).then(()=>toast("انتسخ")).catch(()=>toast("حدد وانسخ يدوياً")); document.getElementById("cl").onclick=()=>modal.remove();
      }
    } else if(c.stage==="awaiting_a"){
      const lastRound=(c.round||1)>=MAX_ROUNDS;
      inner.innerHTML=`${roundsMapHTML(c)}<div class="stagepill">وصل الرد</div><h2>قال المساعد:</h2><div class="bubble ai">${esc(c.proposedResolution)}</div>
        ${c.noteFromResponder?`<label class="f">ملاحظة من ${esc(memberName(c.about))}</label><p style="background:var(--chip);padding:10px 12px;border-radius:10px;">${esc(c.noteFromResponder)}</p>`:""}
        <p class="sub">إذا يناسبك، اضغط موافق — وتصير القضية جزء من السجل اللي يشوفه الجميع (بدون كلامك الخاص).</p>
        <button class="btn" id="agreeBtn">أوافق ✅</button><button class="btn secondary" id="notYet" style="margin-top:8px;">${lastRound?"مو مقتنع بعد":"مو مقتنع — نبدأ جولة ثانية 🔁"}</button>
        ${privateThreadHTML(c.threadA,"اعرض محادثتي الخاصة")}`;
      document.getElementById("agreeBtn").onclick=()=>{ archiveRound(c); addPublicComplaint(c.from,c.about,c.title,c.proposedResolution); c.stage="closed"; saveCases(); if(cloud) cloud.pushCase(c); modal.remove(); render();
        toast("تم! صارت جزء من السجل.");
        setTimeout(()=>toastAction("تبيها قاعدة دائمة للبيت؟","➕ أضفها",()=>{ addAgreedRule(c.proposedResolution,c.id,c.title); toast("انضافت للقواعد 📜"); },9000), 600); };
      document.getElementById("notYet").onclick=()=>{
        if(lastRound){ inner.innerHTML=`<h2>🤝 وصلتوا لأقصى عدد من الجولات (${roundNum(MAX_ROUNDS)})</h2><p class="sub">نقترح تتكلمون مباشرة وجهاً لوجه — أحياناً هذا أقصر طريق من الكتابة.</p><button class="btn secondary" id="cl">إغلاق</button>`; document.getElementById("cl").onclick=()=>modal.remove(); return; }
        archiveRound(c);
        c.neutralSummary=""; c.suggestions=[]; c.noteFromSender=""; c.proposedResolution=""; c.noteFromResponder=""; c.takeaway=""; c.sentAt=0; c.openedAt=0;
        c.round=(c.round||1)+1; c.stage="draft_a"; saveCases(); if(cloud) cloud.pushCase(c); render(); draw();
        toast(`بدأت الجولة ${roundNum(c.round)} — كمّل كلامك الخاص.`); };
    } else { inner.innerHTML=`${roundsMapHTML(c)}<p>هذي القضية ${stageLabel(c.stage)}.</p>${c.proposedResolution?`<h2 style="font-size:1rem;">الاتفاق:</h2><div class="bubble ai">${esc(c.proposedResolution)}</div>`:""}${privateThreadHTML(c.threadA,"اعرض محادثتي الخاصة")}<button class="btn secondary" id="cl" style="margin-top:12px;">إغلاق</button>`; document.getElementById("cl").onclick=()=>modal.remove(); }
    inner.insertAdjacentHTML("beforeend",`<button class="btn secondary small" id="caseDelBtn" style="margin-top:16px;opacity:.7;">🗑️ احذف القضية</button>`);
    document.getElementById("caseDelBtn").onclick=()=>{ modal.remove(); deleteCase(c.id); };
  }
}
function openReceivedCaseB(caseId){
  const c=findCase(caseId); if(!c) return;
  const modal=document.createElement("div"); modal.className="modal-bg"; modal.innerHTML=`<div class="card modal" id="bInner"></div>`; document.body.appendChild(modal);
  modal.onclick=(e)=>{ if(e.target===modal) modal.remove(); };
  if(c.stage==="b_ready") drawSend(); else draw();
  function draw(){
    const inner=document.getElementById("bInner");
    // first look at a received case is what locks the sender out of revising it
    if(c.stage==="received" && !c.openedAt){ c.openedAt=Date.now(); saveCases(); if(cloud) cloud.pushCase(c); }
    inner.innerHTML=`${roundsMapHTML(c)}<div class="stagepill">رسالة خاصة من ${esc(memberName(c.from))}${(c.round||1)>1?` — الجولة ${roundNum(c.round)}`:""}</div><h2>${esc(c.title)}</h2><h2 style="font-size:1rem;color:var(--ink-dim);margin-top:10px;">قال المساعد:</h2><div class="bubble ai">${esc(c.neutralSummary)}</div>
      ${c.noteFromSender?`<label class="f">ملاحظة من ${esc(memberName(c.from))}</label><p style="background:var(--chip);padding:10px 12px;border-radius:10px;">${esc(c.noteFromSender)}</p>`:""}
      ${c.suggestions.length?`<label class="f">اقتراحات</label><ul>${c.suggestions.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
      <p class="sub">هذا خاص بينك وبين المساعد، لين تجهز ردك.</p>${activeFrameworkSummary()?`<p class="footer-note" style="text-align:right;background:var(--chip);padding:8px 10px;border-radius:10px;">${activeFrameworkSummary()}</p>`:""}
      <div class="chatbox" id="chatB">${threadHTML(c.threadB)}</div><textarea id="inputB" placeholder="شنو رأيك؟ اكتب بصراحة."></textarea><button class="btn small secondary" id="sendB" style="margin-top:8px;">أرسل</button><button class="btn" id="finishB" style="margin-top:12px;">جهز ردي النهائي ➜</button>`;
    const chat=document.getElementById("chatB"); chat.scrollTop=chat.scrollHeight;
    document.getElementById("sendB").onclick=async()=>{ const v=document.getElementById("inputB").value.trim(); if(!v) return; document.getElementById("inputB").value="";
      c.threadB.push({role:"user",content:v}); saveCases(); chat.innerHTML=threadHTML(c.threadB)+`<div class="bubble ai">…</div>`; chat.scrollTop=chat.scrollHeight;
      const res=await callAI(buildJudgmentContext()+`أنت مساعد وسيط هادئ ومحايد. طرف ثاني رفع شكوى محايدة (أدناه) عن هذا الشخص. لا تنحاز ولا تلوم. رد على ما قاله بالتحديد، وساعده يفهم وجهة النظر الثانية ويقترح حل عملي منصف. قصير وبسيط.`+fenced("نص الشكوى",c.neutralSummary), c.threadB.filter(t=>t.role!=="error"));
      if(res.ok) c.threadB.push({role:"assistant",content:flagUnverifiedCitations(res.text)}); else { c.threadB.push({role:"error",content:"⚠️ المساعد ما رد: "+res.reason}); c.threadB.push({role:"assistant",content:scriptedPrompt(c.threadB.filter(t=>t.role==="user").length-1)}); }
      saveCases(); chat.innerHTML=threadHTML(c.threadB); chat.scrollTop=chat.scrollHeight; };
    document.getElementById("finishB").onclick=async()=>{ const ut=c.threadB.filter(t=>t.role==="user").map(t=>t.content).join("\n"); toast("لحظة…");
      const res=await callAI(buildJudgmentContext()+`بناءً على الشكوى الأصلية ورد هذا الشخص، اكتب اقتراح حل نهائي عملي ومنصف بجملتين بصيغة "الاتفاق المقترح هو..." بدون لوم. إذا استشهدت بآية أو حديث اذكر مرجعه بين قوسين. ثم اكتب خلاصة قصيرة جداً (٦ كلمات أو أقل) لنتيجة هذه الجولة. رد بصيغة JSON فقط: {"resolution":"...","takeaway":"..."}`+fenced("الشكوى الأصلية",c.neutralSummary)+fenced("اقتراحات سابقة",c.suggestions.join("، ")), [{role:"user",content:ut||"بدون تفاصيل إضافية"}]);
      if(res.ok){ try{ const j=JSON.parse(res.text.match(/\{[\s\S]*\}/)[0]); c.proposedResolution=flagUnverifiedCitations(String(j.resolution||"").trim()); c.takeaway=String(j.takeaway||"").trim().slice(0,60); }
        catch(e){ c.proposedResolution=flagUnverifiedCitations(res.text.trim()); c.takeaway=res.text.trim().slice(0,40); } }
      else { toast("⚠️ "+res.reason); c.proposedResolution=""; c.takeaway=(ut||"بدون رد من المساعد").slice(0,40); }
      if(!c.proposedResolution) c.proposedResolution=ut.slice(0,250)||"نتفق نتكلم الثلاثة بهدوء ونوزع المهام بالتساوي.";
      c.stage="b_ready"; saveCases(); drawSend(); };
  }
  function drawSend(){
    const inner=document.getElementById("bInner");
    inner.innerHTML=`${roundsMapHTML(c)}<div class="stagepill">ردك</div><h2>قال المساعد:</h2><div class="bubble ai">${esc(c.proposedResolution)}</div>
      <p class="sub">كلام المساعد ما يتغيّر — أضف ملاحظتك لو فيه شي ناقص أو غير دقيق.</p>
      <label class="f">ملاحظة منك (اختياري)</label><textarea id="responderNote" placeholder="مثلاً: توضيح، أو تصحيح لشي">${esc(c.noteFromResponder||"")}</textarea>
      <button class="btn" id="sendRes" style="margin-top:10px;">${cloud?`إرسال الرد لـ ${esc(memberName(c.from))} ➜`:"جهز الرمز ➜"}</button><button class="btn secondary" id="backB" style="margin-top:8px;">رجوع</button>${cloud?"":`<div id="codeBox"></div>`}`;
    document.getElementById("backB").onclick=()=>{ c.stage="received"; saveCases(); draw(); };
    document.getElementById("sendRes").onclick=()=>{ c.noteFromResponder=document.getElementById("responderNote").value.trim(); c.stage="b_ready"; saveCases();
      if(cloud){ cloud.pushCase(c); modal.remove(); render(); toast(`✅ أُرسل ردك لـ ${memberName(c.from)}`); }
      else { const pkg=buildPackage(c,"toA"); document.getElementById("codeBox").innerHTML=`<label class="f">أرسل هذا الرمز لـ ${esc(memberName(c.from))}</label><textarea readonly style="font-family:monospace;font-size:0.85rem;height:90px;">${pkg}</textarea>`; } };
  }
}
function openReceiveCodeModal(){
  const modal=document.createElement("div"); modal.className="modal-bg"; modal.innerHTML=`<div class="card modal"><h2>📩 الصق الرمز</h2><textarea id="recvCode" style="font-family:monospace;font-size:0.85rem;height:90px;"></textarea><button class="btn" id="go" style="margin-top:10px;">فتح</button><button class="btn secondary" id="cl" style="margin-top:8px;">إلغاء</button></div>`; document.body.appendChild(modal);
  document.getElementById("cl").onclick=()=>modal.remove();
  document.getElementById("go").onclick=()=>{ const p=readPackage(document.getElementById("recvCode").value); if(!p) return toast("الرمز ما اشتغل"); modal.remove();
    if(p.side==="toB"){ let c=findCase(p.id);
      // a later round of a case this phone already holds — refresh it in place instead of
      // pushing a second copy with the same id (threadB survives, same as the cloud path)
      if(c){ c.title=p.title; c.tag=p.tag||c.tag||""; c.neutralSummary=p.neutralSummary; c.suggestions=p.suggestions||[]; c.noteFromSender=p.noteFromSender||""; c.proposedResolution=""; c.noteFromResponder=""; c.takeaway=""; c.round=p.round||1; c.rounds=p.rounds||[]; c.openedAt=0; c.stage="received"; }
      else cases.push({id:p.id,from:p.from,about:meId,title:p.title,tag:p.tag||"",stage:"received",threadA:[],neutralSummary:p.neutralSummary,suggestions:p.suggestions||[],threadB:[],proposedResolution:"",noteFromSender:p.noteFromSender||"",noteFromResponder:"",takeaway:"",sentAt:0,openedAt:0,round:p.round||1,rounds:p.rounds||[],createdAt:Date.now()});
      saveCases(); openReceivedCaseB(p.id); }
    else { let c=findCase(p.id); if(!c){ c={id:p.id,from:meId,about:p.from,title:p.title,tag:p.tag||"",stage:"awaiting_a",threadA:[],neutralSummary:p.neutralSummary,suggestions:p.suggestions||[],threadB:[],proposedResolution:p.proposedResolution,noteFromSender:"",noteFromResponder:p.noteFromResponder||"",takeaway:p.takeaway||"",sentAt:0,openedAt:0,round:p.round||1,rounds:p.rounds||[],createdAt:Date.now()}; cases.push(c); } else { c.proposedResolution=p.proposedResolution; c.noteFromResponder=p.noteFromResponder||""; c.takeaway=p.takeaway||c.takeaway||""; c.rounds=p.rounds||c.rounds||[]; c.stage="awaiting_a"; } saveCases(); openCaseModal(c.id); } };
}


// ================= RECEIPT SCANNING (vision, proxy only) =================
// Shrink the photo before it leaves the phone: a raw camera JPEG is several MB,
// which the free vision tier will reject outright.
function compressImage(file,maxW){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{ try{
      const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
      const scale=Math.min(1,maxW/iw), w=Math.max(1,Math.round(iw*scale)), h=Math.max(1,Math.round(ih*scale));
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); resolve(cv.toDataURL("image/jpeg",0.7));
    }catch(e){ URL.revokeObjectURL(url); reject(e); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("تعذّر فتح الصورة")); };
    img.src=url;
  });
}
// Same /.netlify/functions/ai endpoint, but vision:true makes it pick a
// multimodal model. The personal-Anthropic-key fallback is not wired for
// images, so this feature needs the proxy.
async function callAIVision(instruction,imageDataUrl){
  await detectProxy();
  if(!proxyAvailable) return {ok:false, reason:"مسح الفاتورة يحتاج خادم الموقع — ما يشتغل بمفتاح شخصي أو بدون إنترنت."};
  try{
    const res=await fetch("/.netlify/functions/ai",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({vision:true,max_tokens:900,messages:[{role:"user",content:[{type:"text",text:instruction},{type:"image_url",image_url:{url:imageDataUrl}}]}]})});
    if(!res.ok){ let detail=""; try{ const j=await res.json(); detail=(j.error&&j.error.message)||JSON.stringify(j); }catch(e){ detail=await res.text().catch(()=>""); }
      return {ok:false, reason:`(${res.status}) ${detail}`.trim()}; }
    const data=await res.json();
    return {ok:true, text:(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n")};
  }catch(e){ return {ok:false, reason:"ما قدرنا نوصل للمساعد — تأكد من الإنترنت. "+(e&&e.message?e.message:"")}; }
}
function openReceiptModal(file){
  const modal=document.createElement("div"); modal.className="modal-bg"; modal.innerHTML=`<div class="card modal" id="rcptInner"></div>`; document.body.appendChild(modal);
  modal.onclick=(e)=>{ if(e.target===modal) modal.remove(); };
  const inner=document.getElementById("rcptInner");
  let items=[];
  const closeBtn=(label)=>`<button class="btn secondary" id="rcptClose" style="margin-top:12px;">${label}</button>`;
  const bindClose=()=>{ document.getElementById("rcptClose").onclick=()=>modal.remove(); };
  inner.innerHTML=`<h2>📷 نقرأ الفاتورة…</h2><p class="sub">ثواني، نحلل الصورة.</p>`;
  (async()=>{
    let dataUrl;
    try{ dataUrl=await compressImage(file,1200); }
    catch(e){ inner.innerHTML=errorCard("قراءة الصورة",e)+closeBtn("إغلاق"); bindClose(); return; }
    const res=await callAIVision(`اقرأ هذه الفاتورة واستخرج الأغراض المشتراة فقط — بدون المجموع أو الضريبة أو اسم المتجر أو التاريخ. رد بصيغة JSON فقط بدون أي شرح: {"items":[{"name":"اسم الغرض","price":"السعر بالأرقام أو فراغ"}]}`, dataUrl);
    if(!res.ok){ inner.innerHTML=`<h2>⚠️ ما قدرنا نقرأ الفاتورة</h2><div class="bubble err">${esc(res.reason)}</div><p class="sub">تقدر تضيف الأغراض يدوياً من فوق.</p>`+closeBtn("إغلاق"); bindClose(); return; }
    try{ const j=JSON.parse(res.text.match(/\{[\s\S]*\}/)[0]);
      items=(j.items||[]).filter(x=>x&&x.name).map(x=>({name:String(x.name).trim(),price:String(x.price==null?"":x.price).trim()})).filter(x=>x.name); }
    catch(e){ items=[]; }
    if(!items.length){ inner.innerHTML=`<h2>⚠️ ما طلع شي واضح من الصورة</h2><p class="sub">جرّب صورة أوضح وأقرب، أو أضف الأغراض يدوياً. هذا اللي رجع:</p><textarea readonly style="font-family:monospace;font-size:0.75rem;direction:ltr;height:110px;">${esc(res.text.slice(0,600))}</textarea>`+closeBtn("إغلاق"); bindClose(); return; }
    drawReview();
  })();
  function drawReview(){
    inner.innerHTML=`<h2>📷 راجع قبل الإضافة</h2><p class="sub">القراءة الآلية ممكن تغلط — صحّح أو احذف أي سطر قبل التأكيد.</p>
      <div id="rcptRows">${items.map((it,i)=>`<div class="row" style="gap:6px;margin-top:8px;"><input type="text" class="rcptName" data-i="${i}" value="${esc(it.name)}" style="flex:2;"><input type="text" class="rcptPrice" data-i="${i}" value="${esc(it.price)}" placeholder="السعر" style="flex:1;" inputmode="decimal"><button class="iconbtn" data-rcpt-del="${i}">✕</button></div>`).join("")}</div>
      <button class="btn" id="rcptOk" style="margin-top:14px;">أضفهم كمشتريات (${ar(items.length)}) ✅</button>`+closeBtn("إلغاء");
    const sync=()=>{ inner.querySelectorAll(".rcptName").forEach(el=>{ items[el.dataset.i].name=el.value; });
                     inner.querySelectorAll(".rcptPrice").forEach(el=>{ items[el.dataset.i].price=el.value; }); };
    inner.querySelectorAll("[data-rcpt-del]").forEach(b=>b.onclick=()=>{ sync(); items.splice(parseInt(b.dataset.rcptDel),1);
      if(!items.length){ modal.remove(); toast("ما انضاف شي."); return; } drawReview(); });
    bindClose();
    document.getElementById("rcptOk").onclick=()=>{ sync(); const keep=items.filter(it=>it.name.trim()); if(!keep.length) return toast("ما فيه أسماء.");
      modal.remove(); keep.forEach(it=>addRestock(it.name.trim(),"",it.price.trim(),"من فاتورة",true)); toast(`✅ انضاف ${ar(keep.length)} غرض للمشتريات`); };
  }
}

// ================= BIND =================
let pendingFreq="daily", pendingDays=[], pendingRotation=[];
function bindView(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ currentView=b.dataset.go; selectedTag=null; render(); });
  document.querySelectorAll("[data-toggle-chore]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); toggleChoreDone(b.dataset.toggleChore, b.dataset.date); });
  document.querySelectorAll("[data-del-chore]").forEach(b=>b.onclick=()=>deleteChore(b.dataset.delChore));
  document.querySelectorAll("[data-toggle-restock]").forEach(b=>b.onclick=()=>toggleRestock(b.dataset.toggleRestock));
  document.querySelectorAll("[data-del-restock]").forEach(b=>b.onclick=()=>deleteRestock(b.dataset.delRestock));
  document.querySelectorAll("[data-del-complaint]").forEach(b=>b.onclick=()=>deleteComplaint(b.dataset.delComplaint));
  document.querySelectorAll("[data-del-rule]").forEach(b=>b.onclick=()=>deleteAgreedRule(b.dataset.delRule));
  document.querySelectorAll("[data-del-case]").forEach(b=>b.onclick=()=>deleteCase(b.dataset.delCase));
  document.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{ selectedTag=b.dataset.tag||null; render(); });
  document.querySelectorAll("[data-confirm-kudos]").forEach(b=>b.onclick=()=>toggleKudosConfirm(b.dataset.confirmKudos));
  document.querySelectorAll("[data-del-kudos]").forEach(b=>b.onclick=()=>deleteKudos(b.dataset.delKudos));
  document.querySelectorAll("[data-cal]").forEach(d=>d.onclick=()=>{ calSelected=calSelected===d.dataset.cal?null:d.dataset.cal; render(); });
  document.querySelectorAll("[data-cal-nav]").forEach(b=>b.onclick=()=>{ calMonth.m+=parseInt(b.dataset.calNav); if(calMonth.m<0){calMonth.m=11;calMonth.y--;} if(calMonth.m>11){calMonth.m=0;calMonth.y++;} calSelected=null; render(); });
  document.querySelectorAll("[data-open-case]").forEach(b=>b.onclick=()=>openCaseModal(b.dataset.openCase));
  document.querySelectorAll("[data-open-received]").forEach(b=>b.onclick=()=>openReceivedCaseB(b.dataset.openReceived));
  document.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>{ settingsView=b.dataset.set; render(); });
  document.querySelectorAll("[data-set-back]").forEach(b=>b.onclick=()=>{ settingsView=null; render(); });
  const $=(id)=>document.getElementById(id);
  if(currentView==="chores"){
    document.querySelectorAll("[data-freq]").forEach(b=>b.onclick=()=>{ pendingFreq=b.dataset.freq; document.querySelectorAll("[data-freq]").forEach(x=>x.classList.toggle("sel",x===b)); $("daysRow").style.display=pendingFreq==="days"?"flex":"none"; $("rotRow").style.display=pendingFreq==="anytime"?"block":"none"; });
    document.querySelectorAll("[data-rot]").forEach(b=>b.onclick=()=>{ const id=b.dataset.rot; pendingRotation=pendingRotation.includes(id)?pendingRotation.filter(x=>x!==id):[...pendingRotation,id]; b.classList.toggle("sel"); });
    document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ const d=parseInt(b.dataset.day); pendingDays=pendingDays.includes(d)?pendingDays.filter(x=>x!==d):[...pendingDays,d]; b.classList.toggle("sel"); });
    $("addChoreBtn").onclick=()=>{ const t=$("newChoreTitle").value.trim(); if(!t) return toast("اكتب اسم المهمة أول."); if(pendingFreq==="days"&&!pendingDays.length) return toast("اختر يوم واحد على الأقل.");       const rot=pendingFreq==="anytime"?pendingRotation.slice():[];
      if(rot.length===1) return toast("الدور يحتاج شخصين على الأقل.");
      // a rotating job belongs to whoever's turn it is, so it must not be pinned to one person
      addChore(t, rot.length?"anyone":$("newChoreAssignee").value, pendingFreq, pendingDays, rot);
      pendingFreq="daily"; pendingDays=[]; pendingRotation=[]; };
  }
  if(currentView==="today"){ const ak=$("addKudosBtn"); if(ak) ak.onclick=()=>{ const v=$("kudosInput").value.trim(); if(!v) return toast("اكتب وش سويت أول."); addKudos(v); }; }
  if(currentView==="restock"){
    $("addRestockBtn").onclick=()=>{ const raw=$("rName").value.trim(); if(!raw) return toast("اكتب اسم الشي أول.");
      // read every field before the first addRestock(), which re-renders and wipes the inputs
      const qty=$("rQty").value.trim(), price=$("rPrice").value.trim(), note=$("rNote").value.trim();
      const parts=raw.split(/\s*(?:,|،)\s*|\s+و\s+/).map(x=>x.trim()).filter(Boolean);
      if(parts.length>1){ parts.forEach(x=>addRestock(x,"","",note)); toast(`تمت إضافة ${ar(parts.length)} أغراض`); }
      else addRestock(parts[0],qty,price,note); };
    const sr=$("scanReceiptBtn"); if(sr) sr.onclick=()=>$("receiptFile").click();
    const rf=$("receiptFile"); if(rf) rf.onchange=()=>{ const f=rf.files&&rf.files[0]; rf.value=""; if(f) openReceiptModal(f); };
  }
  if(currentView==="complaints"){ $("startCaseBtn").onclick=()=>{ const c=newCase(state.settings.members.find(m=>m.id!==meId).id,""); openCaseModal(c.id); }; const rc=$("receiveCaseBtn"); if(rc) rc.onclick=openReceiveCodeModal; }
  if(currentView==="more"){
    const sw=$("switchUserBtn"); if(sw) sw.onclick=()=>{ meId=null; try{localStorage.removeItem(LS_ME);}catch(e){} render(); };
    if(settingsView==="profile"){ $("saveProfileBtn").onclick=()=>{ const p={}; document.querySelectorAll(".profInput").forEach(t=>p[t.dataset.key]=t.value.trim()); state.settings.profiles[meId]=p; pushSettings(); toast("انحفظت بطاقتك."); settingsView=null; render(); }; }
    if(settingsView==="family"){ $("saveNamesBtn").onclick=()=>{ document.querySelectorAll(".renameInput").forEach(i=>{ const m=state.settings.members.find(x=>x.id===i.dataset.id); if(m) m.name=i.value.trim()||m.name; }); pushSettings(); toast("انحفظت."); render(); }; }
    if(settingsView==="cloud"){
      $("saveFamilyBtn").onclick=()=>{ const v=$("familyCodeInput").value.trim(); if(v.length<8) return toast("خلّ الرمز ٨ أحرف على الأقل."); lsSet(LS_FAMILY,v); toast("انحفظ. جاري الاتصال…"); location.reload(); };
      const sq=$("showQrBtn"); if(sq) sq.onclick=()=>{ const box=$("qrBox"); if(box.style.display==="none"){ box.innerHTML=qrSVG(getFamilyCode()); box.style.display="block"; } else box.style.display="none"; };
      const scq=$("scanQrBtn"); if(scq) scq.onclick=()=>{ openQrScanModal((val,err)=>{
        if(!val){ $("scanErrBox").textContent="ما قدرنا نفتح الكاميرا. جرّب الإدخال اليدوي تحت."; return; }
        if(val.trim().length<8){ $("scanErrBox").textContent="الرمز المقروء قصير جداً — جرّب مرة ثانية."; return; }
        lsSet(LS_FAMILY,val.trim()); toast("انحفظ. جاري الاتصال…"); location.reload(); }); };
    }
    if(settingsView==="notify"){
      const en=$("enableNotifyBtn"); if(en) en.onclick=async()=>{ $("notifyMsg").textContent="جاري التفعيل…"; const r=await subscribeToPush(); $("notifyMsg").textContent=r.ok?"":("⚠️ "+r.reason); if(r.ok){ toast("✅ تفعّلت التنبيهات."); render(); } };
      const dn=$("disableNotifyBtn"); if(dn) dn.onclick=async()=>{ await unsubscribeFromPush(); render(); };
    }
    if(settingsView==="ai"){
      $("testAiBtn").onclick=async()=>{ $("testAiOut").textContent="جاري الاختبار…"; const r=await callAI("رد بكلمة واحدة فقط: جاهز", [{role:"user",content:"اختبار"}]); $("testAiOut").innerHTML=r.ok?`<span class="badge-ok">✅ المساعد يشتغل — رد: ${esc(r.text)}</span>`:`<span class="badge-err">❌ ${esc(r.reason)}</span>`; };
      const sk=$("saveKeyBtn"); if(sk) sk.onclick=()=>{ const v=$("apiKeyInput").value.trim(); if(!v) return toast("الصق المفتاح أول."); const share=$("shareKeyCheck")?$("shareKeyCheck").checked:false; if(share&&cloud){ state.settings.aiKey=v; pushSettings(); lsSet(LS_KEY,""); toast("انحفظ ومُشارك مع العائلة."); } else { lsSet(LS_KEY,v); toast("انحفظ على هذا الجوال."); } render(); };
      const ck=$("clearKeyBtn"); if(ck) ck.onclick=()=>{ lsSet(LS_KEY,""); if(cloud){ state.settings.aiKey=""; pushSettings(); } toast("انحذف."); render(); };
    }
    if(settingsView==="display"){
      $("fsDown").onclick=()=>setFontSize(getFontSize()-1);
      $("fsUp").onclick=()=>setFontSize(getFontSize()+1);
      $("fsReset").onclick=()=>setFontSize(FS_DEFAULT);
    }
    if(settingsView==="quran"){ $("useQuranFwCheck").onchange=(e)=>{ lsSet(LS_USE_QURAN_FW,e.target.checked?"1":"0"); toast(e.target.checked?"تفعّل.":"تم إيقافه."); }; }
    if(settingsView==="persona"){ $("savePersonaBtn").onclick=()=>{ lsSet(LS_PERSONA,$("personaInput").value); toast("انحفظ."); }; }
    if(settingsView==="book"){
      $("extractBookBtn").onclick=async()=>{ const f=$("bookFileInput"); let raw=$("bookPasteInput").value.trim(); if(f.files&&f.files[0]){ try{ raw=await f.files[0].text(); }catch(e){ return toast("ما قدرت أقرأ الملف."); } } if(!raw) return toast("ارفع ملف أو الصق نص أول.");
        const pr=$("extractProgress"); pr.style.display="block"; pr.textContent="جاري الاستخراج…"; $("extractBookBtn").disabled=true;
        const r=await extractRulesFromText(raw,(i,n)=>pr.textContent=`جزء ${i} من ${n}`); $("extractBookBtn").disabled=false; pr.style.display="none";
        if(r.ok){ lsSet(LS_BOOKRULES,r.text); saveJSON(LS_BOOKMETA,{title:$("bookTitleInput").value.trim()||"بدون اسم",extractedAt:Date.now()}); toast("تم!"); render(); } else toast("⚠️ "+r.reason); };
      const sb=$("saveBookRulesBtn"); if(sb) sb.onclick=()=>{ lsSet(LS_BOOKRULES,$("bookRulesInput").value); toast("انحفظ."); };
      const cb=$("clearBookBtn"); if(cb) cb.onclick=()=>{ lsSet(LS_BOOKRULES,""); saveJSON(LS_BOOKMETA,{title:"",extractedAt:0}); toast("انحذف."); render(); };
    }
    if(settingsView==="sync"){ $("copySyncBtn").onclick=()=>navigator.clipboard?.writeText(exportCode()).then(()=>toast("انتسخ")).catch(()=>toast("حدد وانسخ يدوياً")); $("syncDoImport").onclick=()=>{ if(importCode($("syncImportInput").value)){ toast("تمت المزامنة!"); settingsView=null; render(); } else toast("الرمز ما اشتغل."); }; }
  }
}
